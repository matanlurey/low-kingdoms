name: Temporary format Milestone 1A specification

on:
  push:
    branches:
      - docs/milestone-1a-headless-rules-spec
    paths:
      - .github/workflows/format-milestone-1a-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: docs/milestone-1a-headless-rules-spec
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: tools/web-tests/package.json
      - run: npm ci --prefix tools/web-tests
      - run: node tools/web-tests/node_modules/prettier/bin/prettier.cjs --write docs/plans/milestone-1a.md
      - name: Commit formatted document
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/plans/milestone-1a.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: apply pinned Prettier to Milestone 1A"
            git push origin HEAD:docs/milestone-1a-headless-rules-spec
          fi
