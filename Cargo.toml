[workspace]
members = ["apps/game", "crates/client", "tools/xtask"]
default-members = ["apps/game"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"
publish = false
repository = "https://github.com/matanlurey/low-kingdoms"

[workspace.dependencies]
bevy = { version = "=0.19.1", default-features = false, features = ["ui_bevy_render", "std", "bevy_winit", "default_font", "webgl2", "x11", "wayland", "png"] }
low-kingdoms-client = { path = "crates/client" }
serde_json = "=1.0.145"
toml = "=0.9.7"
wasm-bindgen = "=0.2.129"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
unused_must_use = "deny"
unfulfilled_lint_expectations = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
must_use_candidate = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
module_name_repetitions = "allow"
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "warn"
invalid_codeblock_attributes = "deny"
invalid_rust_codeblocks = "deny"
bare_urls = "warn"
unescaped_backticks = "warn"

[profile.dev]
opt-level = 1
codegen-units = 1

[profile.dev.package."*"]
opt-level = 3

# Keep build-time macro code generation reliable in constrained verification hosts.
[profile.dev.build-override]
codegen-units = 1

[profile.dev.package.xtask]
opt-level = 0

[profile.release]
codegen-units = 1

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "thin"
codegen-units = 1
